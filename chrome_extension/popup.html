<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta http-equiv="Permissions-Policy" content="camera=*">
  <title>AccessEd</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --clockwork: #72583E;
      --deep-olive: #444210;
      --cafe-noir: #443222;
      --weathered: #888676;
      --linen: #F7F5F3;
      --success: #44422D;
      --danger: #755151;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      margin: 0 auto;
      background: var(--linen);
      font-family: 'DM Sans', sans-serif;
      color: var(--cafe-noir);
      padding: 16px;
    }
    .header { text-align:center; margin-bottom:14px; padding-bottom:12px; border-bottom:1.5px solid rgba(114,27,6,0.15); }
    .header h1 { font-family:'Playfair Display',serif; font-size:20px; color:var(--clockwork); }
    .header p  { font-size:11px; color:var(--weathered); margin-top:2px; }
    .cam-wrap { position:relative; background:#1a1a2e; border-radius:10px; overflow:hidden; margin-bottom:12px; }
    #webcamFeed { width:100%; height:160px; object-fit:cover; display:block; }
    .cam-overlay { position:absolute; bottom:0; left:0; right:0; background:linear-gradient(transparent, rgba(0,0,0,0.7)); padding:8px 10px; display:flex; align-items:center; justify-content:space-between; }
    .conf-label { font-size:11px; color:#a6adc8; }
    .conf-value { font-size:13px; font-weight:600; }
    .conf-bar-wrap { margin-bottom:12px; }
    .conf-bar-bg   { background:#ddd; border-radius:4px; height:8px; }
    .conf-bar-fill { border-radius:4px; height:8px; transition:width 0.4s ease, background 0.4s ease; }
    .conf-status   { display:flex; justify-content:space-between; font-size:11px; color:var(--weathered); margin-top:4px; }
    .pomo-card { background:white; border:1.5px solid rgba(114,27,6,0.15); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
    .pomo-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
    .pomo-title  { font-size:12px; font-weight:500; color:var(--cafe-noir); }
    .pomo-done   { font-size:11px; color:var(--weathered); }
    .pomo-timer  { font-family:'Playfair Display',serif; font-size:36px; text-align:center; color:var(--clockwork); margin-bottom:10px; letter-spacing:2px; }
    .pomo-btns   { display:flex; gap:6px; }
    .pomo-btn    { flex:1; padding:7px; border-radius:7px; border:none; font-size:12px; font-weight:500; cursor:pointer; transition:all 0.15s; }
    .pomo-start  { background:var(--clockwork); color:var(--linen); }
    .pomo-start:hover { background:#5a1504; }
    .pomo-reset  { background:white; color:var(--cafe-noir); border:1.5px solid rgba(114,27,6,0.2); }
    .pomo-len    { display:flex; gap:4px; margin-bottom:8px; justify-content:center; }
    .pomo-len-btn { padding:3px 10px; border-radius:20px; border:1px solid rgba(114,27,6,0.2); background:white; font-size:11px; cursor:pointer; color:var(--weathered); transition:all 0.15s; }
    .pomo-len-btn.active { background:var(--clockwork); color:var(--linen); border-color:var(--clockwork); }
    .stats-row { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:12px; }
    .stat-card  { background:white; border:1.5px solid rgba(114,27,6,0.1); border-radius:8px; padding:8px; text-align:center; }
    .stat-val   { font-size:20px; font-weight:600; color:var(--clockwork); font-family:'Playfair Display',serif; }
    .stat-lbl   { font-size:10px; color:var(--weathered); margin-top:1px; }
    .btn { width:100%; padding:11px; border-radius:10px; border:none; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; cursor:pointer; transition:all 0.2s; margin-bottom:7px; display:flex; align-items:center; justify-content:center; gap:8px; }
    .btn-primary { background:var(--clockwork); color:var(--linen); }
    .btn-primary:hover { background:#5a1504; transform:translateY(-1px); }
    .btn-olive   { background:var(--deep-olive); color:var(--linen); }
    .btn-olive:hover { background:#333108; transform:translateY(-1px); }
    .btn-secondary { background:white; color:var(--cafe-noir); border:1.5px solid rgba(114,27,6,0.2); }
    .btn-secondary:hover { border-color:var(--clockwork); transform:translateY(-1px); }
    .status-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
    .status-pill { display:inline-flex; align-items:center; gap:5px; background:white; border:1px solid rgba(114,27,6,0.2); border-radius:20px; padding:3px 10px; font-size:11px; color:var(--weathered); }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--weathered); }
    .dot.green  { background:#44422D; }
    .dot.red    { background:#755151; }
    .dot.orange { background:#a08670; }
    .section-label { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--weathered); margin-bottom:6px; }
    .divider { height:1px; background:rgba(114,27,6,0.1); margin:10px 0; }
    #camError { display:none; background: #DBC4A5;; border:1px solid #FFF9F3; border-radius:8px; padding:10px; font-size:12px; color:var(--danger); text-align:center; margin-bottom:10px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>AccessEd</h1>
    <p>Focus · Learn · Grow</p>
  </div>

  <div class="status-row">
    <div class="status-pill">
      <span class="dot" id="sessionDot"></span>
      <span id="sessionStatus">Session inactive</span>
    </div>
    <button class="btn btn-secondary" id="toggleSessionBtn" style="width:auto;padding:4px 12px;font-size:11px;margin:0">Start</button>
  </div>

  <div class="section-label">Confusion detector</div>
  <div class="cam-wrap">
    <video id="webcamFeed" autoplay muted playsinline></video>
    <div class="cam-overlay">
      <span class="conf-label">Confusion score</span>
      <span class="conf-value" id="confValue" style="color:#44422D">0.00</span>
    </div>
  </div>
  <div id="camError">Could not access webcam. Please allow camera permission and refresh.</div>

  <div class="conf-bar-wrap">
    <div class="conf-bar-bg">
      <div class="conf-bar-fill" id="confBar" style="width:0%;background:#333108;"></div>
    </div>
    <div class="conf-status">
      <span id="confLabel">Calm</span>
      <span id="confTip">Keep it up!</span>
    </div>
  </div>

  <div class="divider"></div>

  <div class="section-label">Pomodoro timer</div>
  <div class="pomo-card">
    <div class="pomo-header">
      <span class="pomo-title">Focus session</span>
      <span class="pomo-done" id="pomoDone">0 done today</span>
    </div>
    <div class="pomo-len">
      <button class="pomo-len-btn active" data-min="25">25m</button>
      <button class="pomo-len-btn" data-min="45">45m</button>
      <button class="pomo-len-btn" data-min="60">60m</button>
    </div>
    <div class="pomo-timer" id="pomoTimer">25:00</div>
    <div class="pomo-btns">
      <button class="pomo-btn pomo-start" id="pomoStartBtn">▶ Start</button>
      <button class="pomo-btn pomo-reset" id="pomoResetBtn">↺ Reset</button>
    </div>
  </div>

  <div class="divider"></div>

  <div class="section-label">Session stats</div>
  <div class="stats-row">
    <div class="stat-card"><div class="stat-val" id="statSpikes">0</div><div class="stat-lbl">spikes</div></div>
    <div class="stat-card"><div class="stat-val" id="statFocus">100</div><div class="stat-lbl">focus %</div></div>
    <div class="stat-card"><div class="stat-val" id="statCards">0</div><div class="stat-lbl">cards done</div></div>
  </div>

  <div class="divider"></div>

  <button class="btn btn-olive" id="openWebAppBtn"> Open AccessEd App</button>
  <button class="btn btn-secondary" id="syncBtn">Sync session to app</button>

  <script src="popup.js"></script>
</body>
</html>
